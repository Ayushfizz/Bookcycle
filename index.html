<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://movzdlqzpsnytskkotlu.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_EDTEEDTZ-Uwq0uV2O_xInA_43QddtW8';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

let currentUser=null, books=[];

function toast(msg){
  let t=document.getElementById('toast');
  t.textContent=msg;
  t.style.display='block';
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>t.style.display='none',2800);
}

function safe(v){
  return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fav(btn){
  btn.textContent=btn.textContent==='♡'?'♥':'♡';
  btn.style.color=btn.textContent==='♥'?'#b44b3c':'var(--green)';
}

function openAuth(){document.getElementById('authModal').classList.add('show')}
function closeAuth(){document.getElementById('authModal').classList.remove('show')}

function openSell(){
  if(!currentUser){toast('Please log in first to publish a book.');openAuth();return}
  document.getElementById('sellModal').classList.add('show');
}
function closeSell(){document.getElementById('sellModal').classList.remove('show')}

async function refreshUser(){
  const {data}=await db.auth.getSession();
  currentUser=data.session?.user||null;
}

async function login(){
  const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;
  if(!email||!password){toast('Enter email and password.');return}
  const {error}=await db.auth.signInWithPassword({email,password});
  if(error){toast(error.message);return}
  await refreshUser();
  closeAuth();
  toast('Logged in successfully.');
}

async function signup(){
  const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;
  if(!email||password.length<6){toast('Enter email and a password of at least 6 characters.');return}
  const {error}=await db.auth.signUp({email,password,options:{emailRedirectTo:'https://ayushfizz.github.io/Bookcycle/'}});
  if(error){toast(error.message);return}
  toast('Account created. Check your email if confirmation is required.');
}

function renderBooks(rows){
  const list = document.getElementById('booklist'), recent = document.getElementById('recentList');
  list.innerHTML = '';
  recent.innerHTML = '';
  
  if(!rows.length){
    const query = document.getElementById('search').value.trim();
    const msg = query ? `No books found matching "${safe(query)}".` : 'No books listed yet. Be the first to sell one!';
    list.innerHTML = `<p class="section-sub">${msg}</p>`;
    
    if(!query){
      recent.innerHTML = '<div class="mini"><div class="miniart">📚</div><div><b>No listings yet</b><small>New books will appear here</small></div></div>';
    }
    return;
  }

  rows.forEach((b, i) => {
    const card = document.createElement('article');
    card.className = 'book';
    card.dataset.name = [b.title, b.author, b.category, b.description].join(' ').toLowerCase();
    
    const cover = b.image_url ? 
      `<img src="${safe(b.image_url)}" alt="${safe(b.title)}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">` : 
      `<div class="art">📖</div>`;
      
    card.innerHTML = `<div class="cover" style="background:linear-gradient(145deg,#b68c45,#425a40)">${cover}<button class="heart" onclick="fav(this)">♡</button><div class="booktitle">${safe(b.title)}</div></div><div class="bookmeta"><span class="price">₹${Number(b.price).toLocaleString('en-IN')}</span><span class="distance">${safe(b.book_condition || 'Used')}</span></div><div class="bookname">${safe(b.author || b.category || 'Educational book')}</div>`;
    
    if(currentUser && currentUser.id === b.seller_id){
      const del = document.createElement('button');
      del.textContent = 'Delete Book';
      del.style.cssText = 'margin:10px;padding:8px 14px;background:#9b3434;color:white;border:0;border-radius:8px;cursor:pointer;';
      del.onclick = () => deleteBook(b.id);
      card.appendChild(del);
    }
    
    list.appendChild(card);
    
    if(i < 4){
      const mini = document.createElement('div');
      mini.className = 'mini';
      mini.innerHTML = `<div class="miniart">📘</div><div><b>${safe(b.title)}</b><small>${safe(b.category || 'Book')} · ₹${Number(b.price).toLocaleString('en-IN')}</small></div>`;
      recent.appendChild(mini);
    }
  });
}

async function deleteBook(id){
  if(!currentUser) return;
  if(!confirm('Are you sure you want to delete this book?')) return;
  const {error}=await db.from('books').delete().eq('id',id).eq('seller_id',currentUser.id);
  if(error){toast('Delete failed: '+error.message);return;}
  toast('Book deleted successfully');
  await loadBooks();
}

async function loadBooks(){
  const {data,error}=await db.from('books').select('*').order('created_at',{ascending:false});
  if(error){
    toast('Could not load books: '+error.message);
    document.getElementById('booklist').innerHTML='<p class="section-sub">Could not load listings. Please check database permissions.</p>';
    return;
  }
  books=data||[];
  renderBooks(books);
}

function filterBooks(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const rows=books.filter(b=>[b.title,b.author,b.category,b.description].join(' ').toLowerCase().includes(q));
  renderBooks(rows);
}

function category(c){
  document.getElementById('search').value=c;
  filterBooks();
  toast('Showing books matching '+c);
}

function navTo(n){
  document.querySelectorAll('.nav').forEach(b=>b.classList.remove('active'));
  if(window.event?.currentTarget)window.event.currentTarget.classList.add('active');
  if(n==='Account'){
    openAuth();
  }else if(n==='My Books'){
    if(!currentUser){openAuth();return}
    const mine=books.filter(b=>b.seller_id===currentUser.id);
    renderBooks(mine);
    toast('Showing your listings');
  }else if(n==='Category'){
    document.querySelector('.categories').scrollIntoView({behavior:'smooth'});
  }else if(n==='Home'){
    loadBooks();
  }
}

async function addBook(){
  if(!currentUser){toast('Please log in first.');return}
  const title=document.getElementById('newTitle').value.trim(),price=Number(document.getElementById('newPrice').value);
  if(!title||!price||price<=0){toast('Enter book name and a valid price.');return}
  let image_url=null;
  const file=document.getElementById('newPhoto').files[0];
  if(file){
    if(file.size>5*1024*1024){toast('Image must be 5 MB or smaller.');return}
    const ext=file.name.split('.').pop().toLowerCase(),path=`${currentUser.id}/${Date.now()}.${ext}`;
    const {error:upErr}=await db.storage.from('book-images').upload(path,file,{contentType:file.type,upsert:false});
    if(upErr){toast('Photo upload failed: '+upErr.message);return}
    image_url=db.storage.from('book-images').getPublicUrl(path).data.publicUrl;
  }
  const row={
    title,
    author:document.getElementById('newAuthor').value.trim()||null,
    category:document.getElementById('newCategory').value.trim()||null,
    book_condition:document.getElementById('newCondition').value,
    price,
    description:document.getElementById('newDescription').value.trim()||null,
    image_url,
    seller_id:currentUser.id
  };
  const {error}=await db.from('books').insert(row);
  if(error){toast('Could not publish: '+error.message);return}
  closeSell();
  document.querySelectorAll('#sellModal input').forEach(x=>x.value='');
  await loadBooks();
  toast('Your book is now listed!');
}

db.auth.onAuthStateChange((event,session)=>{
  currentUser=session?.user||null;
  if(event==='SIGNED_IN'){closeAuth();}
});
<div id="booklist"></div>
<div id="recentList"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  refreshUser().then(loadBooks);

</script>
