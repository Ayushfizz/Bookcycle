<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookCycle — Read. Reuse. Repeat.</title>
  <style>
    :root {
      --primary: #2e7d32;
      --primary-light: #4caf50;
      --bg: #f9f9f9;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      padding-bottom: 70px;
    }
    header {
      background: var(--card-bg);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-size: 20px;
      font-weight: bold;
      color: var(--primary);
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 15px;
    }
    .search-box {
      width: 100%;
      padding: 12px 15px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 20px;
      box-sizing: border-box;
    }
    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }
    .book-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .book-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 6px;
      background: #eee;
    }
    .book-title {
      font-weight: bold;
      margin: 8px 0 4px 0;
      font-size: 16px;
    }
    .book-price {
      color: var(--primary);
      font-weight: bold;
      margin-bottom: 8px;
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      text-align: center;
    }
    .btn-danger {
      background: #d32f2f;
      margin-top: 5px;
    }
    /* Bottom Navigation Bar */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 1000;
    }
    .nav-item {
      background: none;
      border: none;
      font-size: 14px;
      cursor: pointer;
      color: #666;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .nav-item.active {
      color: var(--primary);
      font-weight: bold;
    }
    /* Toast Notification */
    #toast {
      visibility: hidden;
      min-width: 250px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 4px;
      padding: 12px;
      position: fixed;
      z-index: 2000;
      left: 50%;
      bottom: 80px;
      transform: translateX(-50%);
    }
    #toast.show {
      visibility: visible;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">📚 BookCycle</div>
    <div id="authStatus"><button class="btn" onclick="openAuth()">Login</button></div>
  </header>

  <div class="container">
    <!-- Corrected Search IDs -->
    <input type="text" id="searchInput" class="search-box" placeholder="Search books, authors or exams..." oninput="handleSearch(event)">
    
    <h2>Available Books</h2>
    <div id="booklist" class="book-grid">Loading books...</div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="nav-bar">
    <button class="nav-item active" onclick="navigate('Home')"><span>⌂</span>Home</button>
    <button class="nav-item" onclick="navigate('My Books')"><span>▤</span>My Books</button>
    <button class="nav-item" onclick="navigate('Sell Now')"><span>＋</span>Sell Now</button>
    <button class="nav-item" onclick="navigate('Category')"><span>▦</span>Category</button>
    <button class="nav-item" onclick="navigate('Account')"><span>♙</span>Account</button>
  </nav>

  <div id="toast"></div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://your-supabase-url.supabase.co'; // Apna URL daalein agar change kiya ho
    const SUPABASE_KEY = 'your-supabase-key'; // Apna Key daalein
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let allBooks = [];

    function toast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.className = "show";
      setTimeout(() => { t.className = t.className.replace("show", ""); }, 3000);
    }

    async function loadBooks() {
      const container = document.getElementById('booklist');
      container.innerHTML = "Loading books...";
      
      const { data, error } = await db.from('books').select('*').order('created_at', { ascending: false });
      
      if (error) {
        container.innerHTML = "Error loading books.";
        return;
      }
      
      allBooks = data || [];
      renderBooks(allBooks);
    }

    function renderBooks(books) {
      const container = document.getElementById('booklist');
      if (!books.length) {
        container.innerHTML = "<p>No books found.</p>";
        return;
      }
      
      container.innerHTML = books.map(b => `
        <div class="book-card">
          <img src="${b.image_url || 'https://via.placeholder.com/150'}" alt="${b.title}">
          <div class="book-title">${b.title}</div>
          <div class="book-price">₹${b.price}</div>
          <div>${b.description || ''}</div>
          ${currentUser && currentUser.id === b.seller_id ? `<button class="btn btn-danger" onclick="deleteBook('${b.id}')">Delete Book</button>` : ''}
        </div>
      `).join('');
    }

    function handleSearch(e) {
      const query = e.target.value.toLowerCase();
      const filtered = allBooks.filter(b => 
        (b.title && b.title.toLowerCase().includes(query)) ||
        (b.author && b.author.toLowerCase().includes(query)) ||
        (b.category && b.category.toLowerCase().includes(query))
      );
      renderBooks(filtered);
    }

    async function deleteBook(id) {
      if (!confirm("Are you sure you want to delete this book?")) return;
      const { error } = await db.from('books').delete().eq('id', id);
      if (error) {
        toast("Failed to delete book.");
      } else {
        toast("Book deleted successfully!");
        loadBooks();
      }
    }

    function navigate(n) {
      if (n === 'Home') loadBooks();
      else if (n === 'Sell Now') {
        if (!currentUser) { toast("Please log in first."); return; }
        let title = prompt("Enter Book Title:");
        let price = Number(prompt("Enter Price (₹):"));
        if (title && price) {
          db.from('books').insert([{ title, price, seller_id: currentUser.id }]).then(({error}) => {
            if(!error) { toast("Book listed!"); loadBooks(); }
          });
        }
      } else if (n === 'My Books') {
        if (!currentUser) { toast("Please log in first."); return; }
        const mine = allBooks.filter(b => b.seller_id === currentUser.id);
        renderBooks(mine);
        toast("Showing your listings");
      }
    }

    async function refreshUser() {
      const { data: { session } } = await db.auth.getSession();
      currentUser = session?.user || null;
      if (currentUser) {
        document.getElementById('authStatus').innerHTML = `<span style="font-size:14px;">👤 ${currentUser.email}</span>`;
      }
    }

    db.auth.onAuthStateChange((event, session) => {
      currentUser = session?.user || null;
      refreshUser();
    });

    // Initialize on load
    refreshUser().then(loadBooks);
  </script>
</body>
</html>
